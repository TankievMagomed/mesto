<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Магомед Танкиев" />
    <meta name="description" content="портфолио на Яндекс.Практикуме" />
    <meta name="keywords" content="html, css, js" />
    <link rel="stylesheet" href="./pages/index.css" />
    <title>
      Cервис Mesto: страница, куда можно добавлять фотографии, удалять их и
      ставить лайки
    </title>
  </head>
  <body class="root">
    <div class="page">
      <header class="header">
        <img
          alt="логотип проекта Mesto Russia (сдела ввиде текста)"
          class="header__logo"
          src="./images/icon/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__info-container">
            <img
              src="./images/Jac-Kusto.jpg"
              alt="Фото профиля"
              class="profile__img"
            />
            <div class="profile__info">
              <div class="profile__name-container">
                <h1 class="profile__name">Жак-Ив Кусто</h1>
                <button type="button" class="profile__edit-btn"></button>
              </div>
              <p class="profile__description">Исследователь океана</p>
            </div>
          </div>
          <button type="button" class="profile__add-btn"></button>
        </section>
        <section class="elements">
          <ul class="elements__items">
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/anne-laure-p-PcAhiLRDluY-unsplash.jpg"
                  alt="Дома на побережье и горы на заднем плане по видам как будто бы Балканы или Италия"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Черногория</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/daniel-sessler-AUPja_8Smd0-unsplash.jpg"
                  alt="поля травы и растений у подножия одинокой горы"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Япония</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/handy-wicaksono--c6fD6meQzU-unsplash 2.jpg"
                  alt="скалистый горный хребет"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Северная Америка</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/kirill-pershin-1088404-unsplash.jpg"
                  alt="заброшенный храм на фоне гор"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Карачево-Черкессия</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/kirill-pershin-1404681-unsplash.png"
                  alt="Закат с видом на траву и гору Эльбрус"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Гора Эльбрус</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
            <li class="elements__item">
              <figure class="card">
                <img
                  class="card__img"
                  src="./images/kirill-pershin-1556355-unsplash.png"
                  alt="заснеженные горы"
                />
                <figcaption class="card__name-container">
                  <h2 class="card__name">Домбай</h2>
                  <button type="button" class="card__like-btn"></button>
                </figcaption>
              </figure>
            </li>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© 2026 Mesto Russia</p>
      </footer>
      <section class="popup">
        <form class="popup__container" name="profile-form">
          <legend class="popup__title">Редактировать профиль</legend>
          <fieldset class="popup__user-info">
            <label class="popup__label" for="profile-name">
              <input type="text" id="profile-name" name="name" class="popup__input-name" required/>
            </label>
            <label class="popup__label" for="profile-description">
              <input type="text" id="profile-description" name="description" class="popup__input-description" required/>
            </label>
          </fieldset>
          <button type="submit" class="popup__btn-save">Сохранить</button>
          <button class="popup__btn-close"></button>
        </form>
      </section>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
