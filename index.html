<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Магомед Танкиев" />
    <meta name="description" content="портфолио на Яндекс.Практикуме" />
    <meta name="keywords" content="html, css, js" />
    <link rel="stylesheet" href="./pages/index.css" />
    <title>
      Сервис Mesto: страница, куда можно добавлять фотографии, удалять их и
      ставить лайки
    </title>
  </head>
  <body class="root">
    <div class="page">
      <header class="header">
        <img
          alt="логотип проекта Mesto Russia"
          class="header__logo"
          src="./images/icon/logo.svg"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__info-container">
            <img
              src="./images/Jac-Kusto.jpg"
              alt="Фото профиля"
              class="profile__img"
            />
            <div class="profile__info">
              <div class="profile__name-container">
                <h1 class="profile__name">Жак-Ив Кусто</h1>
                <button type="button" class="profile__edit-btn"></button>
              </div>
              <p class="profile__description">Исследователь океана</p>
            </div>
          </div>
          <button type="button" class="profile__add-btn"></button>
        </section>
        <section class="elements">
          <ul class="elements__items">
            <template id="card">
              <li class="elements__item">
                <figure class="card">
                  <img class="card__img" src="#" alt="" />
                  <figcaption class="card__name-container">
                    <h2 class="card__name"></h2>
                    <button type="button" class="card__like-btn"></button>
                    <button type="button" class="card__delete-btn"></button>
                  </figcaption>
                </figure>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">© 2026 Mesto Russia</p>
      </footer>
      <section class="popup" id="profile-form">
        <form class="popup__container" name="profile-form">
          <fieldset class="popup__user-info">
            <legend class="popup__title">Редактировать профиль</legend>
            <label class="popup__label" for="profile-name">
              <input
                type="text"
                id="profile-name"
                name="name"
                class="popup__input"
                required
              />
            </label>
            <label class="popup__label" for="profile-description">
              <input
                type="text"
                id="profile-description"
                name="description"
                class="popup__input"
                required
              />
            </label>
          </fieldset>
          <button type="submit" class="popup__btn-save">Сохранить</button>
          <button type="button" class="popup__btn-close"></button>
        </form>
      </section>
      <section class="popup" id="card-form">
        <form class="popup__container" name="card-form">
          <fieldset class="popup__user-info">
            <legend class="popup__title">Новое место</legend>
            <label class="popup__label" for="card-name">
              <input
                type="text"
                id="card-name"
                name="card-name"
                class="popup__input"
                placeholder="Название"
                required
              />
            </label>
            <label class="popup__label" for="card-link">
              <input
                type="url"
                id="card-link"
                name="card-link"
                class="popup__input"
                placeholder="Ссылка на картинку"
                required
              />
            </label>
          </fieldset>
          <button type="submit" class="popup__btn-save">Создать</button>
          <button type="button" class="popup__btn-close"></button>
        </form>
      </section>
      <section class="popup" id="image-full">
        <figure class="popup__container-image">
          <img class="popup__full-image" alt="" src="#" />
          <figcaption class="popup__caption"></figcaption>
          <button type="button" class="popup__btn-close"></button>
        </figure>
      </section>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
